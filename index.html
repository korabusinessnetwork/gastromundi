<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: sem isso, o teclado do Android sobe
         POR CIMA do layout e cobre bottom sheets fixas (ex.: "Lançar Pedido" no
         Palm); com isso, o viewport encolhe junto e a folha sobe acima do teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Título estático NEUTRO (marca da plataforma): a marca do tenant é
         aplicada pelo script de branding abaixo (cache) ou pelo app após o
         bootstrap. Nunca a marca de UM cliente hardcodada (decisão 017). -->
    <title>Kora</title>
    <link rel="icon" type="image/svg+xml" href="/icone-kora.svg" />
    <!-- Compartilhamento e busca (achado #4 da auditoria do site: mandar o
         link de kora.codes no WhatsApp não mostrava nada — sem descrição,
         sem imagem, sem cartão).

         Um ÚNICO index.html serve o apex (kora.codes) E todo subdomínio de
         tenant, então tudo daqui é da PLATAFORMA, neutro, nunca a marca de
         um cliente (decisão 017). Três escolhas que parecem falta:

         - SEM <link rel="canonical"> fixo. Apontar todo mundo para
           https://kora.codes/ declararia casacoffee.kora.codes uma cópia do
           apex. O canônico é aplicado em runtime, só no apex — src/lib/seo.js.
         - SEM og:url fixo, pela mesma razão: na falta dele o WhatsApp/Facebook
           usam a própria URL aberta, que é a certa em qualquer host.
         - <title> continua "Kora". O título de venda é aplicado em runtime
           pela landing (buscador executa JS); estático, ele apareceria na aba
           do login de cada estabelecimento.

         O endereço da imagem é absoluto e literal porque precisa resolver
         para robô que não executa JS — e porque o cartão inteiro (imagem,
         título, texto) é a marca KORA: um segundo domínio white-label troca
         este bloco junto com a arte. A imagem é gerada por
         scripts/og-kora.html (o cabeçalho de lá tem o comando). -->
    <meta
      name="description"
      content="KORA é o PDV que se adapta à sua operação: caixa, comanda, delivery, Pix e nota fiscal. Demonstração ao vivo de 30 minutos, sem fidelidade."
    />
    <meta name="theme-color" content="#473CA8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KORA" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="KORA — O PDV que se adapta a você" />
    <meta
      property="og:description"
      content="Caixa, comanda, delivery, Pix e nota fiscal do jeito que a sua operação já funciona. Demonstração ao vivo de 30 minutos, sem fidelidade."
    />
    <meta property="og:image" content="https://kora.codes/og-kora.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KORA — o PDV que se adapta a você" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KORA — O PDV que se adapta a você" />
    <meta
      name="twitter:description"
      content="Caixa, comanda, delivery, Pix e nota fiscal do jeito que a sua operação já funciona. Demonstração ao vivo de 30 minutos, sem fidelidade."
    />
    <meta name="twitter:image" content="https://kora.codes/og-kora.png" />
    <!-- Anti-flash de troca de estabelecimento: aplica a marca/tema em cache
         (gravado por src/lib/brandingCache.js; localStorage é POR ORIGEM,
         então cada subdomínio só vê a própria marca) ANTES da primeira
         pintura — sem isso, casacoffee.kora.codes pintava o visual default
         até o bootstrap responder. Só tokens --gm-* passam (lista fechada,
         mesma regra do brandingCache) e setProperty valida o valor. -->
    <script>
      try {
        var b = JSON.parse(localStorage.getItem("kora_branding_v1"));
        if (b && typeof b === "object") {
          if (typeof b.nome === "string" && b.nome.trim()) {
            document.title = b.nome.trim().toUpperCase() + " by Kora";
          }
          var v = b.variaveis || {};
          for (var k in v) {
            if (/^--gm-[a-z_-]+$/.test(k) && typeof v[k] === "string") {
              document.documentElement.style.setProperty(k, v[k]);
            }
          }
        }
      } catch (e) { /* sem cache/storage: segue o visual default */ }
    </script>
    <!--
      Fontes white-label (ADR-007). São as famílias que o tema de um tenant
      pode escolher via `font_titulo` / `font_texto` (tokens --gm-font-*).
      Todas GRÁTIS (OFL): Sora é a fonte de TEXTO do DNA do Casa Coffee;
      Saira é o stand-in livre da fonte de TÍTULOS do Casa (Rexton, paga —
      licenciar é decisão de custo do dono). Sem tema custom, o GastroMundi
      não usa nenhuma delas (fica no system-ui default), então nada muda.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter é a família de UI padrão da plataforma (tema.css: --gm-font-*
      apontam para ela). Antes NÃO era carregada e o app caía em system-ui;
      agora carrega de fato. JetBrains Mono cobre dados técnicos (--gm-font-mono:
      SKU/IDs/nº de comanda). Ambas GRÁTIS (OFL), custo zero. As demais famílias
      abaixo são as opções white-label que um tenant pode escolher (ADR-007).
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Saira:wght@500;600;700;800&family=Sora:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { overflow: hidden; padding-bottom: env(safe-area-inset-bottom); }
      ::-webkit-scrollbar { width: 0; height: 0; }
      * { scrollbar-width: none; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
